<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="英语特训">
<meta name="theme-color" content="#4A90D9">
<title>零售导购英语 · 半年流利计划</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#333;min-height:100vh;padding-bottom:90px}
.header{background:linear-gradient(135deg,#4A90D9,#357ABD);color:#fff;padding:12px 16px 10px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{font-size:17px;font-weight:600}
.header p{font-size:10px;opacity:.8;margin-top:1px}
.tabs{display:flex;background:#fff;position:sticky;top:56px;z-index:9;border-bottom:1px solid #e0e0e0}
.tab{flex:1;padding:10px 6px;font-size:12px;color:#888;border:none;background:none;cursor:pointer;text-align:center;border-bottom:2px solid transparent;font-weight:500}
.tab.active{color:#4A90D9;border-bottom-color:#4A90D9}
.tab.study{font-weight:700}
.tab.study.active{color:#e67e22;border-bottom-color:#e67e22}
.content{padding:10px}
.page{display:none}
.page.active{display:block}

/* 进度卡片 */
.pcard{background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.pday{font-size:28px;font-weight:800;color:#e67e22;text-align:center}
.plabel{font-size:11px;color:#999;text-align:center;margin:2px 0 8px}
.pbar{height:5px;background:#eee;border-radius:3px;overflow:hidden}
.pbarf{height:100%;background:linear-gradient(90deg,#e67e22,#f39c12);border-radius:3px;transition:width .4s}
.pstats{display:flex;justify-content:space-around;margin-top:6px;font-size:10px;color:#999}

/* 6步进度条 */
.steps{display:flex;gap:4px;padding:8px 12px;background:#fff;border-radius:12px;margin-bottom:8px;justify-content:space-between}
.step-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #ddd;color:#ccc;transition:all .3s;flex-shrink:0}
.step-dot.done{background:#27ae60;border-color:#27ae60;color:#fff}
.step-dot.current{background:#e67e22;border-color:#e67e22;color:#fff;box-shadow:0 0 0 4px rgba(230,126,34,.2)}
.step-dot span{font-size:8px;display:block;line-height:1;text-align:center}

/* 计时器 */
.timer{text-align:center;font-size:13px;color:#888;padding:2px 0 6px}
.timer b{color:#e67e22;font-family:monospace}

/* 区域卡片 */
.zone{background:#fff;border-radius:14px;padding:16px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.zone h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.zone h3 .emoji{font-size:18px}
.zone h3 .tip{font-size:11px;color:#aaa;font-weight:400;margin-left:auto}

/* 闪卡 */
.flash{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:14px;padding:32px 20px;text-align:center;font-size:20px;font-weight:700;min-height:100px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:10px;transition:all .3s;line-height:1.5;user-select:none}
.flash.reveal{background:linear-gradient(135deg,#27ae60,#2ecc71)}
.flash .zh{font-size:16px;font-weight:400;opacity:.9}
.flash-count{text-align:center;font-size:12px;color:#999;margin-bottom:8px}
.btn-row{display:flex;gap:8px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-red{background:#fadbd8;color:#c0392b}
.btn-green{background:#d5f5e3;color:#27ae60}
.btn-blue{background:#4A90D9;color:#fff}
.btn-orange{background:#e67e22;color:#fff}
.btn-gray{background:#eee;color:#999}

/* 跟读 */
.voice-target{font-size:18px;font-weight:600;color:#4A90D9;text-align:center;padding:14px;background:#f0f7ff;border-radius:10px;margin-bottom:8px}
.voice-btns{display:flex;gap:8px;margin-bottom:8px}
.voice-btns button{flex:1}
.voice-score{text-align:center;font-size:32px;font-weight:800;margin:8px 0}
.voice-score.good{color:#27ae60}
.voice-score.ok{color:#e67e22}
.voice-score.low{color:#e74c3c}
.rate-row{display:flex;gap:4px;justify-content:center;margin:8px 0}
.rate-btn{width:36px;height:36px;border-radius:50%;border:2px solid #ddd;background:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
.rate-btn:active{transform:scale(.9)}
.rate-btn.pick{background:#e67e22;border-color:#e67e22;color:#fff}

/* 听写 */
.dict-input{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;font-size:16px;text-align:center;outline:none;margin-bottom:8px;font-family:monospace}
.dict-input:focus{border-color:#4A90D9}
.dict-input.correct{border-color:#27ae60;background:#d5f5e3}
.dict-input.wrong{border-color:#e74c3c;background:#fadbd8}
.dict-answer{font-size:14px;text-align:center;color:#27ae60;font-weight:600;min-height:20px}
.dict-answer.show{color:#e74c3c}
.dict-count{text-align:center;font-size:12px;color:#999;margin-bottom:6px}

/* 翻译 */
.trans-input{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;font-size:16px;outline:none;margin-bottom:8px}
.trans-input:focus{border-color:#4A90D9}

/* 自由说 */
.scenario{font-size:14px;background:#fff7e6;border:1px solid #ffe0a0;border-radius:10px;padding:14px;margin-bottom:10px;line-height:1.6}
.scenario .prompt{font-weight:600;color:#e67e22;margin-bottom:4px}
.scenario .desc{color:#666;font-size:13px}

/* 复习卡片 */
.ritem{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5}
.ritem:last-child{border:none}
.ri-info{flex:1;font-size:13px}
.ri-en{color:#333;font-weight:500}
.ri-zh{color:#999;font-size:11px}
.ri-ago{color:#bbb;font-size:9px}
.ri-btns{display:flex;gap:4px}
.ri-btn{padding:4px 8px;border-radius:10px;border:none;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.ri-again{background:#ffe0e0;color:#c0392b}
.ri-good{background:#d5f5e3;color:#27ae60}
.ri-easy{background:#e8f0fe;color:#4A90D9}

/* 打卡按钮 */
.btn-checkin{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;margin-top:6px;transition:all .2s}
.btn-checkin.locked{background:#ccc;color:#fff;cursor:not-allowed}
.btn-checkin.ready{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff;animation:glow 2s infinite}
.btn-checkin.done{background:#bbb;color:#fff;cursor:default}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(46,204,113,.3)}50%{box-shadow:0 0 20px rgba(46,204,113,.6)}}

/* 全部短语页 */
.search{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:14px;margin-bottom:8px;outline:none;background:#fff}
.search:focus{border-color:#4A90D9}
.sec-hd{font-weight:700;color:#555;padding:6px 4px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between}
.sec-hd .arr{font-size:10px;transition:transform .3s}
.sec-hd.open .arr{transform:rotate(180deg)}
.sec-bd{display:none}
.sec-bd.open{display:block}
.pitem{display:flex;align-items:center;padding:10px 12px;background:#fff;border-radius:10px;margin-bottom:4px;cursor:pointer;transition:background .15s}
.pitem:active{background:#f0f4ff}
.pi-text{flex:1;min-width:0}
.pi-en{font-size:14px;color:#333;font-weight:500}
.pi-zh{font-size:11px;color:#999;margin-top:1px}
.btn-spk{width:30px;height:30px;border-radius:50%;background:#e8f0fe;border:none;font-size:14px;flex-shrink:0;margin-left:6px;cursor:pointer}

/* 我的短句 */
.add-box{background:#fff;border-radius:14px;padding:14px;margin-bottom:8px}
.add-box h3{font-size:14px;margin-bottom:10px}
.add-box input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:6px;outline:none}
.add-box input:focus{border-color:#4A90D9}
.add-box button{width:100%;padding:11px;background:#4A90D9;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}

/* toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 20px;border-radius:16px;font-size:12px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <h1>零售导购英语</h1>
  <p>6个月流利计划 · 第1月</p>
</div>

<div class="tabs" id="tabs">
  <button class="tab study active" data-tab="study">📖 今日特训</button>
  <button class="tab" data-tab="all">📚 短语库</button>
  <button class="tab" data-tab="my">✏️ 我的</button>
</div>

<div class="content">
  <div class="page active" id="page-study"></div>
  <div class="page" id="page-all"></div>
  <div class="page" id="page-my"></div>
</div>
<div class="toast" id="toast"></div>

<script>

{n:'颜色与款式',g:'颜色顺序：<b>light/dark + 颜色</b>（浅蓝/深蓝）。<b>solid</b>=纯色，<b>striped</b>=条纹，<b>floral</b>=花色。<b>navy blue</b>=藏蓝。<b>This color suits you.</b>=这颜色适合你。',

 p:[['What color are you looking for?','您想要什么颜色？'],['We have this in four colors.','这款有四个颜色。'],['This navy blue is very popular.','这个藏蓝色很受欢迎。'],['This floral pattern is trending.','这个花色这季很流行。'],['The solid black is more classic.','纯黑色更经典。'],['Would you like a brighter color?','想要亮一点的颜色吗？']],
 c:[['Do you have this in red?','这件有红色的吗？'],['Yes, we have light red and dark red.','有的，浅红和深红都有。'],['Let me try the dark red.','我试深红的。']]},
{n:'品牌产地',g:'<b>Where is it from?</b> 问产地。<b>It\'s made in...</b>。<b>brand</b>=品牌，<b>designed in</b>=设计地，<b>craftsmanship</b>=工艺，<b>authorized retailer</b>=授权经销商。',
 sp:'一位顾客问这个品牌是哪里的。用英语告诉他这是法国品牌、意大利制造、品质很高、你们是授权经销商。',
 p:[['This brand is very well-known for quality.','这个品牌以品质著称。'],['It\'s designed in France, made in Italy.','法国设计意大利制造。'],['We carry several international brands.','我们代理多个国际品牌。'],['This is a local brand, very popular here.','本地品牌，这里很受欢迎。'],['The craftsmanship is from Japan.','工艺来自日本。'],['We are an authorized retailer.','我们是授权经销商。']],
 c:[['Where is this brand from?','这个品牌是哪里的？'],['It\'s a French brand, very high quality.','法国品牌，品质很高。'],['I\'ve heard of them!','我听说过！']]},
{n:'流行趋势',g:'<b>It\'s trending</b>=现在正流行。<b>best-seller</b>=畅销款。<b>in style</b>=时髦。<b>timeless</b>=永不过时。<b>sell out</b>=卖断货。<b>fashion blogger</b>=时尚博主。',
 sp:'用英语向顾客推荐一款现在最流行的单品。告诉他是这季最火的、时尚博主都在穿、每周都卖断货，劝他趁现在还有码赶紧试。',
 p:[['This style is really trending right now.','这个款现在特别流行。'],['It\'s the hottest item this season.','这是这季最火的单品。'],['Minimalist style is very in right now.','极简风现在很时髦。'],['This classic design never goes out of style.','这个经典设计永不过时。'],['We sell out of this every week.','这款每周都卖断货。'],['Fashion bloggers are all wearing this.','时尚博主都在穿这个。']],
 c:[['What\'s popular right now?','现在流行什么？'],['Minimalist and oversized are both in.','极简风和宽松风都在流行。'],['I love minimalist style!','我超爱极简风！']]},
{n:'周复习描述',g:'本周重点: this/that/these/those 指示、made of 材质、颜色词序、trending 趋势。练习用 3-4 句话完整描述一件商品。',
 sp:'用英语完整描述一件你店里最喜欢的商品：它是什么（衣服类型）、什么材质、有什么颜色、什么品牌/产地、为什么现在流行。至少说 6 句。',
 p:[['Based on what you like, I recommend this.','根据您的喜好，我推荐这件。'],['The quality and design are both excellent.','品质和设计都非常好。'],['This goes well with almost anything.','这件跟什么都好搭。'],['Try pairing it with jeans for a casual look.','配牛仔裤就是休闲风。'],['This piece will last you for years.','这件能穿好多年。'],['I own one myself and I love it.','我自己也有一件，特别喜欢。']],
 c:[['What do you recommend?','你推荐哪件？'],['This one! It\'s perfect for your style.','这件！跟你的风格绝配。'],['You\'re right, I\'ll try it on.','你说得对，我试试。']]}
]},
{w:'尺码价格付款',m:1,d:[
{n:'询问推荐尺码',g:'<b>What size do you wear?</b>。<b>runs small/large</b>=偏小/大，<b>true to size</b>=标准码。<b>size up/down</b>=拿大/小一码。<b>XS/S/M/L/XL</b> 读法要练熟。',
 sp:'顾客拿起一件衣服但不确定尺码。用英语问他穿什么码，然后告诉他这款偏小建议拿大一码，你帮他去拿中号和大号都试试。',
 p:[['What size do you usually wear?','您一般穿什么码？'],['We have all sizes from XS to XXL.','我们有XS到XXL所有码。'],['This style runs a bit small, size up.','这款偏小，建议拿大一码。'],['This one is true to size.','这款是标准码。'],['Let me grab a medium for you.','我帮您拿一件中号。'],['Want to try both sizes to compare?','要两个码都试试对比吗？']],
 c:[['What size should I try?','我该试什么码？'],['You look like a medium. Let\'s try M and L.','我觉得像中号。中号和大号都试试吧。'],['Good idea!','好主意！']]},
{n:'试穿体验',g:'<b>How does it fit?</b> 问合身度。<b>It fits perfectly!</b>=太合身了。<b>a bit tight/loose</b>=有点紧/松。夸人:<b>It looks amazing on you!</b> <b>suits your skin tone</b>=衬肤色。',
 sp:'顾客从试衣间出来。用英语问他穿起来怎么样、告诉他穿上太好看了、说这个颜色很衬他肤色、说衣服简直像量身定做的。',
 p:[['Would you like to try it on?','要试穿一下吗？'],['The fitting rooms are this way.','试衣间在这边。'],['How does it fit?','穿起来怎么样？'],['It looks absolutely amazing on you!','您穿上太好看了！'],['This color really suits your skin tone.','这个颜色很衬您的肤色。'],['It fits like it was made for you!','简直像量身定做的！']],
 c:[['How does it look?','看起来怎么样？'],['Wow! It looks perfect on you!','哇！太适合你了！'],['Really? I do like how it feels.','真的吗？穿着确实挺舒服的。']]},
{n:'询问价格',g:'<b>How much is this?</b>（这个多少钱）。<b>price tag</b>=价签，<b>on sale</b>=打折，<b>full price</b>=原价，<b>30% off</b>=打七折（减30%）。',
 sp:'顾客想买一件衣服问你价格。用英语告诉他原价 500，现在打七折只要 350，省钱 150，非常划算。',
 p:[['How much is this one?','这件多少钱？'],['It\'s 299 yuan.','这件299元。'],['The price tag is on the sleeve.','价格标签在袖子上。'],['Is this on sale?','这件打折吗？'],['It\'s already 30% off.','已经打七折了。'],['Let me check the price for you.','我帮您查一下价格。']],
 c:[['How much is this jacket?','这件夹克多少钱？'],['It\'s 459 yuan, and it\'s on sale — 20% off.','459元，现在打八折。'],['So about 367 yuan? Not bad!','那就是367左右？不错！']]},
{n:'折扣活动',g:'折扣表达：<b>20% off</b>=打八折，<b>half price</b>=半价，<b>buy one get one free</b>=买一送一，<b>members get extra 10% off</b>=会员再享九折。',
 sp:'用英语向顾客介绍本周促销：买两件第二件半价、会员再享九折、活动周日结束。问他要不要办个会员，免费的。',
 p:[['We have a special promotion this week.','这周有特别活动。'],['Buy two, get one at half price.','买两件第二件半价。'],['Members get an extra 10% off.','会员再享九折。'],['This item is 40% off today only.','这件今天限时打六折。'],['The more you buy, the more you save.','买得越多省得越多。'],['This offer ends this Sunday.','活动周日结束。']],
 c:[['Any discounts?','有折扣吗？'],['Yes! These are 30% off, members get extra 5%.','有！这些打七折，会员再享95折。'],['How do I become a member?','怎么成为会员？'],['Just scan this code, it\'s free!','扫这个码就行，免费的！']]},
{n:'付款结账',g:'<b>We accept...</b>（我们接受）。<b>cash/card/WeChat Pay</b>。<b>scan the QR code</b>=扫码。<b>Your total is...</b>=一共...。<b>receipt</b>=小票。<b>Here\'s your change.</b>=找零。',
 sp:'顾客决定买两件。用英语告诉他总价 586 元、问他要扫码还是刷卡、帮他扫了码、问要不要小票、祝他愉快。',
 p:[['We accept cash, card, and WeChat Pay.','支持现金刷卡和微信支付。'],['Your total is 368 yuan.','一共368元。'],['Would you like to scan or swipe?','扫码还是刷卡？'],['Please scan the QR code here.','请扫这里的二维码。'],['Do you need a receipt?','需要小票吗？'],['Here\'s your receipt, have a nice day!','小票给您，祝愉快！']],
 c:[['That will be 368 yuan total.','一共368元。'],['Can I pay by WeChat?','可以微信吗？'],['Of course! Please scan here.','当然！扫这里。']]},
{n:'退换政策',g:'<b>return policy</b>=退换政策。<b>return</b>=退货，<b>exchange</b>=换货。<b>within 30 days</b>=30天内。<b>keep the receipt and tags</b>=保留小票和吊牌。<b>final sale</b>=不退不换。',
 sp:'顾客担心买回去不合适。用英语告诉他30天内凭小票可以退换、吊牌不能剪、特价商品不退不换、有任何问题拿回来就行。',
 p:[['Here\'s your change, 32 yuan.','找您32元。'],['You can return or exchange within 30 days.','30天内可以退换。'],['Just keep the receipt and the tags on.','保留小票和吊牌就行。'],['Sale items are final sale, no returns.','特价商品不退不换。'],['We also offer a 7-day price match.','我们还有七天保价。'],['If anything is wrong, just bring it back.','有任何问题拿回来就行。']],
 c:[['What\'s your return policy?','退换政策是怎样的？'],['30 days with receipt. Tags attached.','30天内凭小票，吊牌不能剪。'],['That\'s fair. Thank you!','合理，谢谢！']]},
{n:'周复习实战',g:'本周重点: What size / runs small / How does it fit / How much / discount / accept / return。完整走一遍：推荐尺码→试穿→谈价格→结账→说明退换。',
 sp:'从顾客挑选商品开始到结账完成，用英语走完整个交易流程：尺码→试穿→价格→付款→小票→退换说明。至少说 8 句话。',
 p:[['Let me wrap these up nicely for you.','我帮您包好看点。'],['Would you like a gift box?','需要礼品盒吗？'],['Thank you for shopping with us!','感谢您来购物！'],['I hope you enjoy your new clothes!','希望您喜欢新衣服！'],['We have a loyalty program—want to join?','我们有会员积分要加入吗？'],['You saved 120 yuan today!','您今天省了120元！']],
 c:[['Here\'s your bag and receipt.','您的袋子和收据。'],['Thanks! I\'ll definitely come back.','谢谢！我一定再来。'],['We look forward to seeing you!','期待下次见！']]}
]},
{w:'日常交流延伸',m:1,d:[
{n:'天气寒暄',g:'<b>Small talk</b>（寒暄）很重要。聊天气最安全：<b>It\'s a beautiful day!</b> / <b>It\'s been so hot lately.</b>（最近好热）。用 <b>It\'s + 形容词</b> 描述天气。',
 sp:'今天天气特别好，一位顾客进来你跟他寒暄天气。用英语说今天天气真好、这种天气最适合逛街、问他周末有什么安排。',
 p:[['It\'s a beautiful day today!','今天天气真好！'],['It\'s been so hot lately, hasn\'t it?','最近好热是吧？'],['The weather is perfect for shopping!','这种天气最适合逛街了！'],['I hope it doesn\'t rain this weekend.','希望周末别下雨。'],['It\'s getting cooler in the evening.','傍晚开始变凉了。'],['Spring is my favorite season.','春天是我最喜欢的季节。']],
 c:[['Nice weather today, isn\'t it?','今天天气真好，是吧？'],['Yes! Perfect for going out.','是啊！特别适合出门。'],['Are you doing anything fun later?','等会儿有什么好玩的安排吗？']]},
{n:'周末休闲',g:'<b>What do you do on weekends?</b>（周末干嘛）。<b>hang out</b>=出去玩，<b>chill at home</b>=宅家，<b>catch up on sleep</b>=补觉，<b>try new restaurants</b>=探新店。',
 sp:'和一位顾客闲聊周末。用英语问他周末一般做什么、告诉他你喜欢和朋友出去玩或者宅家看电影、问他有什么爱好。',
 p:[['What do you usually do on weekends?','你周末一般做什么？'],['I like to hang out with friends.','我喜欢和朋友出去玩。'],['Sometimes I just chill at home.','有时候就宅在家。'],['Do you have any hobbies?','你有什么爱好吗？'],['I enjoy trying new restaurants.','我喜欢探新店。'],['That sounds like a lot of fun!','听起来很有意思！']],
 c:[['Any plans for the weekend?','周末有什么计划吗？'],['Not really, just going to relax.','没什么，就放松放松。'],['Same here! We all need a break.','我也是！大家都需要休息。']]},
{n:'家庭朋友',g:'<b>How\'s your family?</b>（家人好吗）。<b>siblings</b>=兄弟姐妹，<b>only child</b>=独生子女，<b>get along with</b>=相处好，<b>Family is everything.</b>=家人最重要。',
 sp:'顾客带着孩子来店里。用英语夸孩子可爱、问他多大了、问他有没有其他孩子、说自己有一个姐姐/妹妹。',
 p:[['How is your family doing?','家里人都好吗？'],['They\'re doing great, thanks for asking!','都挺好的谢谢关心！'],['Do you have any siblings?','你有兄弟姐妹吗？'],['I have one older sister.','我有一个姐姐。'],['My parents live in the same city.','我爸妈住在同一个城市。'],['Family is everything to me.','家人对我来说最重要。']],
 c:[['Do you have kids?','你有孩子吗？'],['Yes, a five-year-old daughter.','有个五岁的女儿。'],['She must be adorable!','一定很可爱吧！']]},
{n:'美食推荐',g:'<b>tasty</b>=好吃（比delicious口语化），<b>spicy</b>=辣，<b>recommend</b>=推荐，<b>I\'m a big fan of...</b>=我超喜欢。<b>Can you handle spicy food?</b>=能吃辣吗。',
 sp:'用英语向顾客推荐附近一家餐厅：告诉他你知道一家很棒的火锅店、那里的菜特别好吃、你最爱点的是毛肚、问他能吃辣的吗。',
 p:[['Have you tried any good restaurants lately?','最近有吃什么好的餐厅吗？'],['I know a great hotpot place nearby.','我知道附近一家很棒的火锅店。'],['The food there is absolutely delicious.','那里的菜特别好吃。'],['I\'m a big fan of spicy food.','我超爱吃辣的。'],['Can you handle very spicy food?','你能吃很辣的吗？'],['Let me recommend my favorite dish.','我来推荐我最爱的菜。']],
 c:[['Know any good places to eat around here?','这附近有什么好吃的吗？'],['There\'s an amazing noodle shop two blocks away.','隔两条街有家超棒的面馆。'],['I\'ll check it out, thanks!','我去试试谢了！']]},
{n:'出行交通',g:'<b>How do you get here?</b>（怎么来的）。<b>take the subway</b>=坐地铁，<b>drive</b>=开车。<b>It takes about...</b>=大约花...。<b>rush hour</b>=高峰期。<b>convenient</b>=方便。',
 sp:'和顾客聊他怎么来的。用英语问他一般怎么来这边、自己坐地铁觉得超方便、告诉他高峰期开车很堵、店后面有停车场。',
 p:[['How do you usually get here?','你一般怎么过来？'],['I take the subway, it\'s super convenient.','我坐地铁，超方便。'],['It takes about 20 minutes by bus.','坐公交大概20分钟。'],['The traffic can be really bad during rush hour.','高峰期交通很堵。'],['Is there parking nearby?','附近能停车吗？'],['There\'s a parking lot behind the store.','店后面就有停车场。']],
 c:[['Did you drive here?','你开车来的吗？'],['No, I took the subway. Much faster.','没有坐地铁。快多了。'],['Smart! Driving is a nightmare at this hour.','明智！这个点开车是噩梦。']]},
{n:'表达感受',g:'<b>I feel...</b>（我感觉）。<b>excited</b>=兴奋，<b>tired</b>=累，<b>stressed</b>=压力大。<b>in a good mood</b>=心情好。<b>Treat yourself!</b>=犒劳自己。<b>It makes my day.</b>=让我开心。',
 sp:'今天你心情特别好，和顾客聊天。用英语说你今天很开心、逛街让人心情好、看到顾客满意你就满足了、告诉他应该犒劳一下自己。',
 p:[['I feel really happy today!','我今天特别开心！'],['Shopping always puts me in a good mood.','逛街总能让我心情好。'],['I\'m a bit tired after a long day.','忙了一天有点累了。'],['Treat yourself — you deserve it!','犒劳一下自己，你值得！'],['Retail therapy is real, isn\'t it?','购物疗法是真的吧？'],['Seeing customers happy makes my day.','看到顾客开心我就满足了。']],
 c:[['You look happy today!','你今天看起来很开心！'],['I am! I just got a promotion!','是啊！我刚升职了！'],['Congratulations! That\'s amazing!','恭喜！太棒了！'],['Treat yourself — you earned it!','犒劳自己——你应得的！']]},
{n:'月度总结',g:'本月你学了: 问候→自我介绍→询问需求→介绍商品→材质颜色→尺码试穿→价格付款→退换政策→日常寒暄。核心句型能串成完整对话。尝试不看中文直接说出来。',
 sp:'用英语自由表达：回顾这一个月你学了什么、哪句话你觉得最有用于、你现在能用英语帮顾客做什么、你对接下来的学习有什么期待。至少说 5 句。',
 p:[['You\'ve made great progress this month!','这个月进步很大！'],['I can now help customers in English.','我现在能用英语帮顾客了。'],['Practice makes perfect — keep it up!','熟能生巧，继续加油！'],['Don\'t be afraid to make mistakes.','别怕犯错。'],['Every conversation makes you better.','每次对话都让你进步。'],['I\'m proud of how far you\'ve come.','为你走到这里而骄傲。']],
 c:[['How do you feel about your English now?','你现在英语感觉怎么样？'],['Much more confident! I can actually talk!','自信多了！真的能聊了！'],['That\'s what I love to hear. Keep going!','就爱听这个。继续前进！']]}
]},
// ============ 第2个月：日常生活口语 ============
{w:'吃饭与出行',m:2,d:[
{n:'餐厅点餐',g:'<b>I\'ll have...</b> 点餐万能句（我要...），比 I want 礼貌十倍。<b>Can I get...?</b> 同样高频。服务员问 <b>Are you ready to order?</b>，没想好就说 <b>We need a few more minutes.</b>（再等几分钟）。牛排熟度：<b>rare</b> 三分 / <b>medium</b> 五分 / <b>well-done</b> 全熟。',
 sp:'你走进一家西餐厅。用英语完成：说两位用餐、要看菜单、点一份五分熟牛排和一杯冰水、服务员问好了没你说再等两分钟。',
 p:[['A table for two, please.','两位，谢谢。'],['Can I see the menu, please?','能看下菜单吗？'],['Are you ready to order?','可以点餐了吗？'],['We need a few more minutes.','我们再看几分钟。'],['I\'ll have the steak, medium, please.','我要牛排，五分熟。'],['Can I get a glass of ice water?','能来杯冰水吗？']],
 c:[['Are you ready to order?','可以点餐了吗？'],['Yes. I\'ll have the steak, medium.','可以。我要牛排五分熟。'],['Anything to drink?','喝点什么？'],['Just ice water, thanks.','冰水就好，谢谢。']],
 v:[['menu','菜单'],['order','点餐'],['steak','牛排'],['medium','五分熟'],['well-done','全熟'],['ice water','冰水'],['fork','叉子'],['napkin','餐巾']],

// ===== 发音引擎：自动挑选更自然的声音 + 防卡死 =====
let enVoices=[];
function loadVoices(){
  try{enVoices=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().indexOf('en')===0)}catch(e){}
}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(){
  if(!enVoices.length) loadVoices();
  // 按自然度优先挑声音（Google/微软在线自然音 > 系统自带）
  const prefs=['Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Guy','Microsoft Ana','Samantha','Alex','Microsoft Zira','Google UK English'];
  for(const p of prefs){const v=enVoices.find(v=>v.name.indexOf(p)>=0);if(v) return v}
  const us=enVoices.find(v=>v.lang==='en-US');return us||enVoices[0]||null;
}
const synthLoading=new Set();
let speakGen=0;
function speak(t,btnEl){
  // 防止重复点击同一个按钮
  if(btnEl&&synthLoading.has(btnEl)) return;
  let guard=null;
  const release=()=>{if(guard){clearTimeout(guard);guard=null}
    if(btnEl){synthLoading.delete(btnEl);btnEl.disabled=false;btnEl.style.opacity=''}};
  if(btnEl){synthLoading.add(btnEl);btnEl.disabled=true;btnEl.style.opacity='0.5'}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    const v=pickVoice();if(v)u.voice=v;
    u.lang='en-US';u.rate=0.88;u.pitch=1;
    u.onend=u.onerror=release;
    // 兜底：onend 不触发时也能恢复，防止按钮永久卡死
    guard=setTimeout(release,Math.min(Math.max(2500,t.length*160),10000));
    // Chrome 的坑：cancel() 后立刻 speak() 会丢语音，延迟 60ms 规避；
    // 用 speakGen 保证快速连点时只有最后一次点击真正发声
    const g=++speakGen;
    setTimeout(()=>{if(g!==speakGen){release();return}try{speechSynthesis.speak(u)}catch(e){release()}},60);
  }catch(e){release();toast('发音引擎加载中，请稍后再试')}
}

// 计时器（重绘页面时不清零，累计今日练习时长）
function startTimer(){stopTimer();timerId=setInterval(()=>{timerSec++;updateTimer()},1000)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function updateTimer(){const m=Math.floor(timerSec/60),s=timerSec%60;const el=document.getElementById('timer-num');if(el)el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}

// 寻找当前天的数据
function findDay(){
  let acc=0;
  for(const w of CURR){for(let i=0;i<w.d.length;i++){if(acc===currentDay) return{w,d:w.d[i]};acc++}}
  return null;
}

// 步数统计
function completedSteps(){
  const ss=getSteps(),k='d'+currentDay;return ss[k]?Object.values(ss[k]).filter(v=>v).length:0;
}
function allStepsDone(){return completedSteps()>=6}

// 打卡
function checkIn(){
  if(!allStepsDone()){toast('请先完成全部 6 步训练');return}
  const done=getDone();
  if(done.includes(currentDay)){toast('今天已经打卡了');return}
  done.push(currentDay);saveDone(done);
  // 把今天学的 6 句存入已学短语库
  archiveToday();
  const el=document.getElementById('btn-checkin');
  if(el){el.textContent='✅ 今日已完成 · 明天继续加油！';el.className='btn-checkin done';el.disabled=true}
  toast('🎉 打卡成功！今天你练了 '+Math.floor(timerSec/60)+' 分钟，继续加油！');
}
function archiveToday(){
  const learned=getLearned();
  const wk=currentDay<7?'第1周·接待问候':currentDay<14?'第2周·商品材质':currentDay<21?'第3周·尺码试穿':'第4周·付款售后';
  dayData.p.forEach(p=>{
    // 去重
    if(!learned.some(l=>l.en===p[0])) learned.push({en:p[0],zh:p[1],week:wk,day:currentDay+1});
  });
  saveLearned(learned);
}

// ===== 再练一次：不清除完成记录，只重新打开该步练习界面 =====
let redoStepIdx=-1;
function redoStep(step){
  redoStepIdx=step;
  renderStudy();
  const zones=document.querySelectorAll('#page-study .zone');
  if(zones[step]) zones[step].scrollIntoView({behavior:'smooth',block:'start'});
}
function stepDoneHTML(step){
  return '<div style="text-align:center;color:#27ae60;font-weight:600;padding:14px 0 8px">✅ 本步已完成</div>'
    +'<button class="btn btn-gray" style="width:100%" onclick="redoStep('+step+')">🔁 再练一次（不影响打卡）</button>';
}

// 标记某步完成 — 增量更新，不重绘全页
function markStep(step){
  const ss=getSteps(),k='d'+currentDay;
  if(!ss[k]) ss[k]={};
  ss[k][['flash','pron','dict','trans','speak','gram'][step]]=true;
  saveSteps(ss);
  redoStepIdx=-1;
  // 把当前 zone 内容替换为完成态（带"再练一次"入口）
  const zones=document.querySelectorAll('#page-study .zone');
  if(zones[step]){
    let el=zones[step].querySelector('h3').nextElementSibling;
    while(el){const nxt=el.nextElementSibling;el.remove();el=nxt}
    const done=document.createElement('div');
    done.innerHTML=stepDoneHTML(step);
    zones[step].appendChild(done);
  }
  // 增量更新：只刷新步骤圆点 + 按钮
  updateStepDots();
  updateCheckInBtn();
  // 滚动到下一步
  if(zones[step+1]) zones[step+1].scrollIntoView({behavior:'smooth',block:'center'});
  toast('完成！继续下一步 →');
}
function updateStepDots(){
  const ss=getSteps(),k='d'+currentDay;
  const dots=document.querySelectorAll('.step-dot');
  const stepNames=['flash','pron','dict','trans','speak','gram'];
  let cp=0;
  for(let i=0;i<6;i++) if(ss[k]&&ss[k][stepNames[i]]) cp++;
  dots.forEach((d,i)=>{
    d.className='step-dot';
    if(ss[k]&&ss[k][stepNames[i]]) d.classList.add('done');
    else if(i===cp||(cp===6&&i===5)) d.classList.add('current');
  });
}
function updateCheckInBtn(){
  const doneDays=getDone(),alldone=allStepsDone(),isDone=doneDays.includes(currentDay);
  const btn=document.getElementById('btn-checkin');
  if(!btn) return;
  if(isDone){btn.textContent='✅ 今日已完成 · 明天继续加油！';btn.className='btn-checkin done';btn.disabled=true}
  else if(alldone){btn.textContent='🎯 全部完成，立即打卡！';btn.className='btn-checkin ready';btn.disabled=false}
  else{btn.textContent='🔒 请完成上面全部 6 步训练';btn.className='btn-checkin locked';btn.disabled=false}
}

// ============================================================
// 间隔复习
// ============================================================
const intervals=[1,3,7,14,30];
function getReviewDue(){
  const data=getReview(),today=new Date().toISOString().slice(0,10),due=[];
  for(const[key,val]of Object.entries(data)){if(val.nextReview<=today) due.push({key,...val})}
  return due.slice(0,8);
}
function reviewAction(key,grade){
  const data=getReview();if(!data[key]) return;
  const e=data[key],idx=Math.min(e.reviewCount||0,intervals.length-1);
  if(grade==='easy'){e.interval=intervals[Math.min(idx+2,intervals.length-1)];e.reviewCount=(e.reviewCount||0)+2}
  else if(grade==='good'){e.interval=intervals[idx];e.reviewCount=(e.reviewCount||0)+1}
  else{e.interval=1;e.reviewCount=Math.max(0,(e.reviewCount||0)-2)}
  const next=new Date();next.setDate(next.getDate()+e.interval);
  e.nextReview=next.toISOString().slice(0,10);e.lastReview=new Date().toISOString().slice(0,10);
  data[key]=e;saveReview(data);
}
function initReviewForDay(dayIdx){
  const data=getReview(),today=new Date(),r={},fd=findDay();
  if(!fd) return;
  fd.d.p.forEach((p,i)=>{
    const key='d'+dayIdx+'_p'+i;
    if(!data[key]){const next=new Date();next.setDate(next.getDate()+1);r[key]={en:p[0],zh:p[1],lastReview:'',nextReview:next.toISOString().slice(0,10),interval:1,reviewCount:0}}
  });
  if(Object.keys(r).length){Object.assign(data,r);saveReview(data)}
}
function reviewItem(btn,key,grade){
  reviewAction(key,grade);
  // 动画移除该复习项
  const item=btn.closest('.ritem');
  if(item){item.style.transition='opacity .3s,transform .3s';item.style.opacity='0';item.style.transform='translateX(30px)';setTimeout(()=>{if(item.parentNode)item.remove();updateCheckInBtn()},350)}
}
function daysAgo(d){return Math.floor((new Date()-new Date(d))/86400000)}

function calcStreak(dd){if(dd.length===0)return 0;const s=[...dd].sort((a,b)=>b-a);const t=getTodayIdx();if(!s.includes(t)&&!s.includes(t-1))return 0;let n=0,p=s[0];for(const d of s){if(n===0||p-d<=1){n++;p=d;}else break;}return n}

function flipFlash(){

    card.innerHTML=flashCards[flashIdx][0]+'<br><span style="font-size:13px;opacity:.7">点击翻面看中文</span>';
  }else{
    card.classList.add('reveal');
    card.innerHTML='<span class="zh">'+flashCards[flashIdx][1]+'</span>';
  }
}
function flashResult(known){
  flashIdx++;
  if(flashIdx>=flashCards.length){
    document.getElementById('flash-card').innerHTML='✅ 全部 '+flashCards.length+' 张闪卡已完成！';
    document.getElementById('fc').textContent=flashCards.length;
    // 翻完后可直接再来一遍，不用完成本步
    document.getElementById('flash-btns').innerHTML='<button class="btn btn-blue" style="width:100%" onclick="restartFlash()">🔁 再翻一遍</button>';

  document.getElementById('fc').textContent=flashIdx+1;
}
function restartFlash(){
  flashIdx=0;

}

function toggleRecord(){
  if(isRecording){stopRecord();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('请用Chrome浏览器打开');return}
  voiceRec=new SR();voiceRec.lang='en-US';voiceRec.interimResults=false;
  const btn=document.getElementById('btn-record');
  btn.textContent='🔴 正在听...';btn.style.background='#e74c3c';btn.style.color='#fff';
  isRecording=true;voiceRec.start();
  voiceRec.onresult=e=>{
    const said=e.results[0][0].transcript.trim().toLowerCase();
    const target=dayData.p[pronIdx][0].toLowerCase();
    const score=compareText(said,target);
    const pct=Math.round(score*100);
    const sc=document.getElementById('voice-score');
    let cls='low',emoji='😅';
    if(pct>=80){cls='good';emoji='🎉'}else if(pct>=50){cls='ok';emoji='👍'}
    sc.innerHTML=emoji+' '+pct+'<span style="font-size:14px">%</span>';sc.className='voice-score '+cls;
    stopRecordUI();
    if(pct>=80){
      document.getElementById('voice-result').innerHTML='你说：<b>"'+said+'"</b><br><span style="color:#27ae60">✅ 过关！正在进入下一句…</span>';
      // 若 1 秒内用户没手动切句，则自动前进
      const myIdx=pronIdx;
      setTimeout(()=>{if(pronIdx===myIdx) nextPron()},1000);
    }else{
      document.getElementById('voice-result').innerHTML='你说：<b>"'+said+'"</b><br>💪 再录一次，或点「下一句 →」跳过';
    }
  };
  voiceRec.onerror=()=>{stopRecordUI();toast('没听清，靠近一点再试')};
  voiceRec.onend=()=>{stopRecordUI()};
}
function stopRecord(){if(voiceRec){voiceRec.stop();voiceRec=null}stopRecordUI()}
function stopRecordUI(){
  isRecording=false;
  const btn=document.getElementById('btn-record');
  if(btn){btn.textContent='🎤 跟读录音';btn.style.background='';btn.style.color=''}
}
// 跟读：上一句 / 下一句 / 6句完成后自动标记本步完成
function updatePronUI(){
  const pn=document.getElementById('pn');if(!pn) return;
  pn.textContent=pronIdx+1;
  document.getElementById('voice-target').textContent=dayData.p[pronIdx][0];
  document.getElementById('voice-score').innerHTML='';
  document.getElementById('voice-result').innerHTML='';
}
function nextPron(){
  stopRecord();
  if(pronIdx>=dayData.p.length-1){
    // 6 句全部走完，自动完成本步
    markStep(1);toast('6 句跟读全部完成！进入听写');
    return;
  }
  pronIdx++;updatePronUI();
}
function prevPron(){
  stopRecord();
  if(pronIdx>0){pronIdx--;updatePronUI()}
}
function compareText(said,target){
  const sw=said.split(/\s+/).filter(w=>w.length>2);
  const tw=target.split(/\s+/).filter(w=>w.length>2);
  if(tw.length===0)return 0;
  let m=0;for(const w of tw){if(sw.some(s=>s===w||(s.length>3&&(s.includes(w)||w.includes(s)))))m++}
  return m/tw.length;
}

// ============================================================
// STEP 3: 听写逻辑
// ============================================================
let dictSpkBusy=false,dictGuard=null;
function playDict(){
  if(dictSpkBusy) return;
  dictSpkBusy=true;
  const release=()=>{dictSpkBusy=false;if(dictGuard){clearTimeout(dictGuard);dictGuard=null}};
  try{speechSynthesis.cancel()}catch(_){}
  const u=new SpeechSynthesisUtterance(dayData.p[Math.min(dictIdx,dayData.p.length-1)][0]);
  const v=pickVoice();if(v)u.voice=v;
  u.lang='en-US';u.rate=0.8;
  u.onend=u.onerror=release;
  // 兜底：onend 不触发时 8 秒后自动解锁，防止"播放听写"按钮永久失效
  dictGuard=setTimeout(release,8000);
  setTimeout(()=>{try{speechSynthesis.speak(u)}catch(e){release()}},60);
}
function checkDict(){
  const inp=document.getElementById('dict-input');
  const ans=document.getElementById('dict-answer');
  const user=inp.value.trim();
  const correct=dayData.p[dictIdx][0];
  if(!user){toast('请先输入');return}
  dictAttempted=true;
  const score=compareText(user.toLowerCase(),correct.toLowerCase());
  if(score>=0.7){inp.className='dict-input correct';ans.innerHTML='✅ 正确！';ans.className='dict-answer'}
  else{inp.className='dict-input wrong';ans.innerHTML='❌ 正确答案：<b>'+correct+'</b>';ans.className='dict-answer show'}
  document.getElementById('dict-next').style.display='block';
}
function revealDict(){
  document.getElementById('dict-input').value=dayData.p[dictIdx][0];
  document.getElementById('dict-input').className='dict-input';
  document.getElementById('dict-answer').innerHTML='正确答案已显示，多读几遍再试下一句';
  document.getElementById('dict-answer').className='dict-answer show';
  document.getElementById('dict-next').style.display='block';
}
function nextDict(){
  dictIdx++;
  if(dictIdx>=3){
    document.getElementById('dict-input').style.display='none';
    document.getElementById('dict-answer').innerHTML='✅ 3句听写全部完成！';
    document.getElementById('dict-next').style.display='none';
    document.getElementById('dict-finish').style.display='block';
    // 只隐藏本区域内的 播放/检查/显示答案 按钮（之前 nth-child 选错区域，会误伤跟读区）
    const zone=document.getElementById('dict-finish').closest('.zone');
    zone.querySelectorAll('.btn').forEach(b=>{if(b.textContent.includes('播放')||b.textContent.includes('检查')||b.textContent.includes('显示'))b.style.display='none'});
    return;
  }
  document.getElementById('dc').textContent=dictIdx+1;
  document.getElementById('dict-input').value='';
  document.getElementById('dict-input').className='dict-input';
  document.getElementById('dict-answer').innerHTML='';
  document.getElementById('dict-answer').className='dict-answer';
  document.getElementById('dict-next').style.display='none';
  dictAttempted=false;
}

// ============================================================
// STEP 4: 翻译逻辑
// ============================================================
function checkTrans(){
  const inp=document.getElementById('trans-input');
  const ans=document.getElementById('trans-answer');
  const user=inp.value.trim();
  if(!user){toast('请先输入');return}
  const correct=dayData.p[transIdx+3]?dayData.p[transIdx+3][0]:dayData.p[transIdx][0];
  const score=compareText(user.toLowerCase(),correct.toLowerCase());
  if(score>=0.6){inp.style.borderColor='#27ae60';inp.style.background='#d5f5e3';ans.innerHTML='✅ 基本正确！参考：<b>'+correct+'</b>';ans.className='dict-answer'}
  else{inp.style.borderColor='#e74c3c';inp.style.background='#fadbd8';ans.innerHTML='❌ 参考答案：<b>'+correct+'</b>';ans.className='dict-answer show'}
  document.getElementById('trans-next').style.display='block';
}
function revealTrans(){
  const correct=dayData.p[transIdx+3]?dayData.p[transIdx+3][0]:dayData.p[transIdx][0];
  document.getElementById('trans-input').value=correct;
  document.getElementById('trans-answer').innerHTML='参考答案已显示，多读几遍再试下一句';
  document.getElementById('trans-answer').className='dict-answer show';
  document.getElementById('trans-next').style.display='block';
}
function nextTrans(){
  transIdx++;
  if(transIdx>=3){
    document.getElementById('trans-input').style.display='none';
    document.getElementById('trans-answer').innerHTML='✅ 3句翻译全部完成！';
    document.getElementById('trans-next').style.display='none';
    document.getElementById('trans-finish').style.display='block';
    // 只隐藏本区域内的 检查/显示答案 按钮（之前 nth-child 选错区域，会误伤听写区）
    const zone=document.getElementById('trans-finish').closest('.zone');
    zone.querySelectorAll('.btn').forEach(b=>{if(b.textContent.includes('检查')||b.textContent.includes('显示'))b.style.display='none'});
    return;
  }
  document.getElementById('tc').textContent=transIdx+1;
  document.getElementById('trans-input').value='';
  document.getElementById('trans-input').style.borderColor='#ddd';
  document.getElementById('trans-input').style.background='#fff';
  document.getElementById('trans-answer').innerHTML='';
  document.getElementById('trans-answer').className='dict-answer';
  document.getElementById('trans-next').style.display='none';
  const zh=dayData.p[transIdx+3]?dayData.p[transIdx+3][1]:dayData.p[transIdx][1];
  document.getElementById('trans-zh').textContent=zh;
}

// ============================================================
// STEP 5: 自由表达
// ============================================================
function toggleSpeak(){
  if(isRecording){stopRecord();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('请用Chrome浏览器打开');return}
  voiceRec=new SR();voiceRec.lang='en-US';voiceRec.interimResults=true;
  const btn=document.getElementById('btn-speak');
  btn.textContent='🔴 正在录音...';btn.style.background='#e74c3c';btn.style.color='#fff';
  isRecording=true;voiceRec.start();
  voiceRec.onresult=e=>{
    let said='';
    for(let i=0;i<e.results.length;i++) said+=e.results[i][0].transcript+' ';
    document.getElementById('speak-result').innerHTML='<b>你说的：</b><br>'+said.trim();
  };
  voiceRec.onerror=()=>{stopRecordUI2();toast('没听清，再试一次')};
  voiceRec.onend=()=>{stopRecordUI2()};
}
function stopRecordUI2(){
  isRecording=false;
  const btn=document.getElementById('btn-speak');
  if(btn){btn.textContent='🎤 开始录音回答';btn.style.background='';btn.style.color=''}
}

// ============================================================
// 全部短语页面
// ============================================================
function renderAll(){
  let h='<input class="search" id="search" type="text" placeholder="🔍 搜索短语..." oninput="filterAll()">';
  Object.keys(PHRASES).forEach((cat,i)=>{
    h+='<div class="sec-hd'+(i===0?' open':'')+'" onclick="this.classList.toggle(\'open\');this.nextElementSibling.classList.toggle(\'open\')"><span>'+cat+' ('+PHRASES[cat].length+'句)</span><span class="arr">▼</span></div>';
    h+='<div class="sec-bd'+(i===0?' open':'')+'" id="col-'+cat+'">';
    PHRASES[cat].forEach(p=>{
      h+='<div class="pitem" onclick="speak(\''+p[0].replace(/'/g,"\\'")+'\')"><div class="pi-text"><div class="pi-en">'+p[0]+'</div><div class="pi-zh">'+p[1]+'</div></div><button class="btn-spk" onclick="event.stopPropagation();speak(\''+p[0].replace(/'/g,"\\'")+'\')">🔊</button></div>';
    });
    h+='</div>';
  });
  // 已学短语库（每日打卡自动归档）
  const learned=getLearned();
  if(learned.length>0){
    h+='<div class="sec-hd open" style="background:#fff3e0" onclick="this.classList.toggle(\'open\');this.nextElementSibling.classList.toggle(\'open\')"><span>📖 已学内容 ('+learned.length+'句)</span><span class="arr">▼</span></div>';
    h+='<div class="sec-bd open">';
    // 按周分组
    const weeks=['第1周·接待问候','第2周·商品材质','第3周·尺码试穿','第4周·付款售后'];
    weeks.forEach(w=>{
      const items=learned.filter(l=>l.week===w);
      if(!items.length) return;
      h+='<div style="font-size:11px;color:#e67e22;font-weight:600;padding:6px 0 2px">'+w+' ('+items.length+'句)</div>';
      items.forEach(p=>{
        h+='<div class="pitem learned-item" onclick="speak(\''+p.en.replace(/'/g,"\\'")+'\')"><div class="pi-text"><div class="pi-en">'+p.en+'</div><div class="pi-zh">'+p.zh+' <span style="font-size:10px;color:#ccc">Day'+p.day+'</span></div></div><button class="btn-spk" onclick="event.stopPropagation();speak(\''+p.en.replace(/'/g,"\\'")+'\')">🔊</button></div>';
      });
    });
    h+='</div>';
  }
  document.getElementById('page-all').innerHTML=h;
}
function filterAll(){
  const q=document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('#page-all .pitem').forEach(el=>{
    el.style.display=(!q||el.textContent.toLowerCase().includes(q))?'flex':'none';
  });
}

// ============================================================
// 我的短句
// ============================================================
function renderMy(){
  const items=getMy();
  let h='<div class="add-box"><h3>✏️ 添加自定义短句</h3>';
  h+='<input id="my-en" placeholder="English phrase"><input id="my-zh" placeholder="中文翻译">';
  h+='<button onclick="addMy()">添加</button></div>';
  if(!items.length){h+='<div style="text-align:center;color:#bbb;padding:30px;font-size:13px">还没有自定义短句</div>'}
  else{items.forEach((p,i)=>{h+='<div class="pitem" onclick="speak(\''+p[0].replace(/'/g,"\\'")+'\')"><div class="pi-text"><div class="pi-en">'+p[0]+'</div><div class="pi-zh">'+p[1]+'</div></div><button class="btn-spk" onclick="event.stopPropagation();speak(\''+p[0].replace(/'/g,"\\'")+'\')">🔊</button><button class="btn-spk" style="background:#fee" onclick="event.stopPropagation();delMy('+i+')">🗑</button></div>'});}
  document.getElementById('page-my').innerHTML=h;
}
function addMy(){const en=document.getElementById('my-en').value.trim(),zh=document.getElementById('my-zh').value.trim();if(!en||!zh){toast('请填写完整');return}const items=getMy();items.push([en,zh]);saveMy(items);toast('已添加');renderMy()}
function delMy(i){const items=getMy();items.splice(i,1);saveMy(items);renderMy();toast('已删除')}

// ============================================================
// Tab 切换
// ============================================================
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+t.dataset.tab).classList.add('active');
  if(t.dataset.tab==='study') renderStudy();
  if(t.dataset.tab==='all') renderAll();
  if(t.dataset.tab==='my') renderMy();
}));

// 启动
renderStudy();renderAll();renderMy();
</script>
