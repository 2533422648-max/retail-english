<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="零售英语">

<title>零售导购英语 · 1小时学习</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#333;min-height:100vh;padding-bottom:80px}
.app-header{background:linear-gradient(135deg,#4A90D9,#357ABD);color:#fff;padding:14px 16px 10px;text-align:center;position:sticky;top:0;z-index:10}
.app-header h1{font-size:18px;font-weight:600}
.app-header p{font-size:11px;opacity:.8;margin-top:2px}
.tabs{display:flex;background:#fff;position:sticky;top:62px;z-index:9;border-bottom:1px solid #e0e0e0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:0;padding:11px 8px;font-size:13px;color:#888;border:none;background:none;cursor:pointer;text-align:center;border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
.tab.active{color:#4A90D9;border-bottom-color:#4A90D9}
.tab.study-tab{font-weight:700}
.tab.study-tab.active{color:#e67e22;border-bottom-color:#e67e22}
.content{padding:10px}
.page{display:none}
.page.active{display:block}

/* 学习进度卡片 */
.pcard{background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.pday{font-size:30px;font-weight:800;color:#e67e22;text-align:center}
.plabel{font-size:12px;color:#999;text-align:center;margin-top:2px}
.pbar{height:6px;background:#eee;border-radius:3px;margin-top:10px;overflow:hidden}
.pbarf{height:100%;background:linear-gradient(90deg,#e67e22,#f39c12);border-radius:3px;transition:width .4s}
.pstats{display:flex;justify-content:space-around;margin-top:8px;font-size:11px;color:#999}

/* section headers */
.sec{font-size:14px;font-weight:700;color:#555;padding:10px 4px 6px;display:flex;align-items:center;gap:6px}
.sec .emoji{font-size:18px}

/* phrase cards */
.pcard.list{padding:0;overflow:hidden}
.pitem{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .15s}
.pitem:last-child{border-bottom:none}
.pitem:active{background:#f5f7ff}
.pitem .pi{flex:1;min-width:0}
.pitem .en{font-size:15px;color:#333;font-weight:500}
.pitem .zh{font-size:12px;color:#999;margin-top:2px}
.btn-spk{width:34px;height:34px;border-radius:50%;background:#e8f0fe;border:none;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-left:8px;cursor:pointer}
.btn-spk:active{background:#4A90D9;color:#fff}

/* grammar box */
.gbox{background:#fff7e6;border:1px solid #ffe0a0;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.7;margin-bottom:10px}
.gbox .gt{font-weight:700;color:#e67e22;margin-bottom:4px}

/* conversation box */
.cbox{background:#f0f7ff;border:1px solid #c8ddf8;border-radius:10px;padding:10px 14px;margin-bottom:10px}
.cbox .ct{font-weight:700;color:#4A90D9;margin-bottom:6px;font-size:13px}
.cbox .cl{padding:4px 6px;border-radius:4px;cursor:pointer;font-size:14px;margin-bottom:2px}
.cbox .cl:active{background:#e0ecff}
.cbox .cen{color:#333}
.cbox .czh{color:#888;font-size:12px;margin-top:1px}

/* voice record */
.voice-area{text-align:center;padding:16px 0}
.btn-record{display:inline-block;padding:12px 32px;background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;border:none;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-record:active{transform:scale(.95)}
.btn-record.listening{background:linear-gradient(135deg,#27ae60,#2ecc71);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(46,204,113,.4)}50%{box-shadow:0 0 0 12px rgba(46,204,113,0)}}
.voice-result{margin-top:10px;font-size:13px;color:#666;min-height:20px}
.voice-result .match{color:#27ae60;font-weight:600}
.voice-result .miss{color:#e74c3c;text-decoration:line-through}

/* quiz */
.quiz-q{font-size:15px;color:#333;margin-bottom:10px;font-weight:500;line-height:1.5}
.quiz-q .blank{display:inline-block;border-bottom:2px dashed #e67e22;min-width:60px;text-align:center;color:#e67e22;font-weight:700;margin:0 3px;padding:0 4px}
.quiz-opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.quiz-opt{padding:8px 18px;background:#fff;border:2px solid #ddd;border-radius:20px;font-size:14px;cursor:pointer;font-weight:500;transition:all .15s}
.quiz-opt:active{transform:scale(.95)}
.quiz-opt.correct{background:#d5f5e3;border-color:#27ae60;color:#27ae60}
.quiz-opt.wrong{background:#fadbd8;border-color:#e74c3c;color:#e74c3c}
.quiz-fb{font-size:13px;padding:4px 0;min-height:22px}

/* review section */
.ritem{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #f5f5f5}
.ritem:last-child{border:none}
.ritem .ri{flex:1;font-size:14px}
.ritem .ri .en{color:#333;font-weight:500}
.ritem .ri .zh{color:#999;font-size:12px}
.ritem .ri .ago{color:#bbb;font-size:10px}
.rbtns{display:flex;gap:6px;flex-shrink:0}
.rbtn{padding:5px 10px;border-radius:12px;border:none;font-size:11px;cursor:pointer;font-weight:600;white-space:nowrap}
.rbtn.again{background:#ffe0e0;color:#c0392b}
.rbtn.good{background:#d5f5e3;color:#27ae60}
.rbtn.easy{background:#e8f0fe;color:#4A90D9}

/* done button */
.btn-done{display:block;width:100%;padding:14px;background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;margin-top:10px}
.btn-done:active{background:#27ae60}
.btn-done.done{background:#bbb;cursor:default}

/* collection search */
.search-box{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px;margin-bottom:10px;outline:none;background:#fff}
.search-box:focus{border-color:#4A90D9}

/* add section */
.add-box{background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.add-box h3{font-size:14px;margin-bottom:10px}
.add-box input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:8px;outline:none}
.add-box input:focus{border-color:#4A90D9}
.add-box button{width:100%;padding:12px;background:#4A90D9;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.add-box button:active{background:#357ABD}

/* collapsible */
.sec-col{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 4px}
.sec-col .arr{font-size:11px;transition:transform .3s}
.sec-col.open .arr{transform:rotate(180deg)}
.col-body{display:none}
.col-body.show{display:block}

/* toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* tabs badge */
.tab .badge{display:inline-block;background:#e74c3c;color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;margin-left:3px;vertical-align:top}
</style>
</head>

const LS={done:'study_done_1h',streak:'study_streak_1h',review:'review_data_1h',my:'my_phrases_1h'};
let studyDone=false, currentDay=0, quizAnswered=false, quizCorrect=0, reviewItems=[], isRecording=false, recognition=null;

function getTodayIndex(){const s=new Date('2026-07-13'),t=new Date(),d=Math.floor((t-s)/86400000);return Math.max(0,Math.min(d,27))}

function getDone(){try{return JSON.parse(localStorage.getItem(LS.done)||'[]')}catch(e){return[]}}
function saveDone(v){localStorage.setItem(LS.done,JSON.stringify(v))}

function getReview(){try{return JSON.parse(localStorage.getItem(LS.review)||'{}')}catch(e){return{}}}
function saveReview(v){localStorage.setItem(LS.review,JSON.stringify(v))}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

// 间隔复习系统
// ============================================================
const intervals=[1,3,7,14,30];
function getReviewDue(){
  const data=getReview(),today=new Date().toISOString().slice(0,10),due=[];
  for(const[key,val]of Object.entries(data)){
    if(val.nextReview<=today) due.push({key,...val});
  }
  return due.slice(0,10);
}
function reviewAction(key,grade){
  const data=getReview();
  if(!data[key]) return;
  const entry=data[key],idx=Math.min((entry.reviewCount||0),intervals.length-1);
  if(grade==='easy'){entry.interval=intervals[Math.min(idx+2,intervals.length-1)];entry.reviewCount=(entry.reviewCount||0)+2}
  else if(grade==='good'){entry.interval=intervals[idx];entry.reviewCount=(entry.reviewCount||0)+1}
  else{entry.interval=1;entry.reviewCount=Math.max(0,(entry.reviewCount||0)-2)}
  const next=new Date();next.setDate(next.getDate()+entry.interval);
  entry.nextReview=next.toISOString().slice(0,10);entry.lastReview=new Date().toISOString().slice(0,10);
  data[key]=entry;saveReview(data);
}
function initReviewForDay(dayIdx){
  const data=getReview(),today=new Date(),r={};
  const day=CURR.find(w=>dayIdx>=w.d.reduce((s,d)=>s+1,0) || true);
  let acc=0,found=null;
  for(const w of CURR){
    for(let i=0;i<w.d.length;i++){
      if(acc===dayIdx){found=w.d[i];break}
      acc++;
    }
    if(found) break;
  }
  if(!found) return;
  found.p.forEach((p,i)=>{
    const key=`d${dayIdx}_p${i}`;
    if(!data[key]){
      const next=new Date();next.setDate(next.getDate()+1);
      r[key]={en:p[0],zh:p[1],lastReview:'',nextReview:next.toISOString().slice(0,10),interval:1,reviewCount:0};
    }
  });
  if(Object.keys(r).length>0){Object.assign(data,r);saveReview(data)}
}

function renderStudy(){
  currentDay=getTodayIndex();
  let acc=0,weekData=null,dayData=null;
  for(const w of CURR){
    for(let i=0;i<w.d.length;i++){
      if(acc===currentDay){weekData=w;dayData=w.d[i];break}
      acc++;
    }
    if(dayData) break;
  }
  if(!dayData) return;

  const doneDays=getDone();
  studyDone=doneDays.includes(currentDay);
  const streak=calcStreak(doneDays);
  const progress=Math.round((doneDays.length/28)*100);
  quizAnswered=false; quizCorrect=0;

  // 初始化今日复习记录
  initReviewForDay(currentDay);
  reviewItems=getReviewDue();

  let h='<div class="pcard"><div class="pday">Day '+(currentDay+1)+'</div>';
  h+='<div class="plabel">'+weekData.w+' · '+dayData.n+'</div>';
  h+='<div class="pbar"><div class="pbarf" style="width:'+progress+'%"></div></div>';
  h+='<div class="pstats"><span>📅 '+doneDays.length+'/28 天</span><span>🔥 连续 '+streak+' 天</span><span>🔄 '+reviewItems.length+' 待复习</span></div></div>';

  // 新短语
  h+='<div class="sec"><span class="emoji">📖</span> 今日新内容（6句）</div><div class="pcard list">';
  dayData.p.forEach((p,i)=>{
    h+='<div class="pitem" onclick="speak(\''+p[0].replace(/'/g,"\\'")+'\')"><div class="pi"><div class="en">'+p[0]+'</div><div class="zh">'+p[1]+'</div></div><button class="btn-spk" onclick="event.stopPropagation();speak(\''+p[0].replace(/'/g,"\\'")+'\')">🔊</button></div>';
  });
  h+='</div>';

  // 语法小课堂
  h+='<div class="sec"><span class="emoji">📝</span> 语法小课堂</div>';
  h+='<div class="gbox"><div class="gt">💡 今日语法</div>'+dayData.g+'</div>';

  // 场景对话
  h+='<div class="sec"><span class="emoji">💬</span> 场景对话</div><div class="cbox"><div class="ct">🎧 点击英文收听（角色扮演）</div>';
  dayData.c.forEach((l,i)=>{
    const speaker=i%2===0?'🅰':'🅱';
    h+='<div class="cl" onclick="speak(\''+l[0].replace(/'/g,"\\'")+'\')"><div class="cen">'+speaker+' '+l[0]+'</div><div class="czh">'+l[1]+'</div></div>';
  });
  h+='</div>';

  // 跟读练习
  h+='<div class="sec"><span class="emoji">🗣️</span> 跟读练习</div><div class="pcard"><div style="font-size:13px;color:#666;margin-bottom:8px">选一句今天学的短语，点击录音按钮大声跟读。系统会帮你对比发音。</div>';
  h+='<div id="voice-target" style="font-size:16px;font-weight:600;color:#4A90D9;text-align:center;padding:8px;background:#f0f7ff;border-radius:8px;margin-bottom:10px">'+dayData.p[0][0]+'</div>';
  h+='<div class="voice-area"><button class="btn-record" id="btn-record" onclick="toggleRecord()">🎤 开始跟读</button></div>';
  h+='<div class="voice-result" id="voice-result"></div>';
  h+='<button style="display:block;width:100%;padding:8px;background:#f0f0f0;border:none;border-radius:6px;font-size:12px;margin-top:6px;cursor:pointer" onclick="nextVoiceTarget()">换一句跟读 →</button></div>';

  // 小测验
  if(dayData.f){
    h+='<div class="sec"><span class="emoji">✍️</span> 小测验</div><div class="pcard"><div class="quiz-q">'+dayData.f.q.replace('___','<span class="blank">???</span>')+'</div>';
    h+='<div class="quiz-opts" id="quiz-opts">';
    const opts=shuffle([...dayData.f.o]);
    opts.forEach(o=>{h+='<button class="quiz-opt" onclick="checkQuiz(\''+o.replace(/'/g,"\\'")+'\',\''+dayData.f.a.replace(/'/g,"\\'")+'\')">'+o+'</button>'});
    h+='</div><div class="quiz-fb" id="quiz-fb"></div></div>';
  }

  // 智能复习
  if(reviewItems.length>0){
    h+='<div class="sec"><span class="emoji">🔄</span> 今日复习（'+reviewItems.length+'句待巩固）</div><div class="pcard">';
    reviewItems.forEach((item,i)=>{
      const ago=item.lastReview?daysAgo(item.lastReview):'新';
      h+='<div class="ritem"><div class="ri" onclick="speak(\''+item.en.replace(/'/g,"\\'")+'\')"><div class="en">'+item.en+'</div><div class="zh">'+item.zh+'</div><div class="ago">上次复习：'+(typeof ago==='number'?ago+'天前':ago)+'</div></div><div class="rbtns"><button class="rbtn again" onclick="handleReview(\''+item.key+'\',\'again\',this)">再练</button><button class="rbtn good" onclick="handleReview(\''+item.key+'\',\'good\',this)">掌握</button><button class="rbtn easy" onclick="handleReview(\''+item.key+'\',\'easy\',this)">简单</button></div></div>';
    });
    h+='</div>';
  }

  // 完成按钮
  h+='<div style="text-align:center;padding:8px 0;font-size:12px;color:#aaa">✅ 学完新内容、做完测验、复习完成 → 打卡</div>';
  h+='<button class="btn-done'+(studyDone?' done':'')+'" id="btn-done" onclick="finishDay()"'+(studyDone?' disabled':'')+'>'+(studyDone?'✅ 今日已完成 · 明天继续加油！':'🎯 完成今日学习，打卡！')+'</button>';

  document.getElementById('page-study').innerHTML=h;
  voiceTargetIdx=0;
}

function calcStreak(doneDays){
  if(doneDays.length===0) return 0;
  const sorted=[...doneDays].sort((a,b)=>b-a);
  const today=getTodayIndex();
  if(!sorted.includes(today)&&!sorted.includes(today-1)) return 0;
  let streak=0,prev=sorted[0];
  for(const d of sorted){
    if(streak===0||prev-d<=1){streak++;prev=d}else break;
  }
  return streak;
}

function daysAgo(dateStr){return Math.floor((new Date()-new Date(dateStr))/86400000)}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ============================================================
// 测验
// ============================================================
function checkQuiz(choice,answer){
  if(quizAnswered) return;
  quizAnswered=true;
  const fb=document.getElementById('quiz-fb');
  const opts=document.querySelectorAll('.quiz-opt');
  opts.forEach(o=>{
    if(o.textContent===answer) o.classList.add('correct');
    else if(o.textContent===choice&&choice!==answer) o.classList.add('wrong');
    o.style.pointerEvents='none';
  });
  if(choice===answer){quizCorrect=1;fb.innerHTML='<span style="color:#27ae60">✅ 正确！</span>'}
  else{quizCorrect=0;fb.innerHTML='<span style="color:#e74c3c">❌ 正确答案是：<b>'+answer+'</b></span>'}
}

// ============================================================
// 跟读录音
// ============================================================
let voiceTargetIdx=0;
function nextVoiceTarget(){
  const day=CURR.flatMap(w=>w.d)[currentDay];
  if(!day) return;
  voiceTargetIdx=(voiceTargetIdx+1)%day.p.length;
  document.getElementById('voice-target').textContent=day.p[voiceTargetIdx][0];
  document.getElementById('voice-result').innerHTML='';
}

function toggleRecord(){
  if(isRecording){stopRecord();return}
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){toast('当前浏览器不支持语音识别，请用Chrome打开');return}
  recognition=new SpeechRecognition();
  recognition.lang='en-US';
  recognition.interimResults=false;
  recognition.maxAlternatives=1;
  const btn=document.getElementById('btn-record');
  btn.textContent='🎤 正在听...';btn.classList.add('listening');
  isRecording=true;
  recognition.start();
  recognition.onresult=(e)=>{
    const said=e.results[0][0].transcript.trim().toLowerCase();
    const target=document.getElementById('voice-target').textContent.trim().toLowerCase();
    const result=document.getElementById('voice-result');
    const match=compareText(said,target);
    const pct=Math.round(match*100);
    let cls=pct>=80?'match':pct>=50?'':"miss";
    result.innerHTML='你说：<span class="'+cls+'">"'+said+'"</span> · 匹配度 <b>'+pct+'%</b>';
    if(pct>=80) result.innerHTML+=' 🎉';
    stopRecordUI();
  };
  recognition.onerror=()=>{stopRecordUI();toast('没听清，再试一次')};
  recognition.onend=()=>{stopRecordUI()};
}
function stopRecord(){if(recognition){recognition.stop();recognition=null}stopRecordUI()}
function stopRecordUI(){
  isRecording=false;
  const btn=document.getElementById('btn-record');
  btn.textContent='🎤 开始跟读';btn.classList.remove('listening');
}
function compareText(said,target){
  const sw=said.split(/\s+/).filter(w=>w.length>2);
  const tw=target.split(/\s+/).filter(w=>w.length>2);
  if(tw.length===0) return 0;
  let match=0;
  for(const w of tw){if(sw.some(s=>s===w||(s.length>3&&w.length>3&&(s.includes(w)||w.includes(s))))) match++}
  return match/tw.length;
}

// ============================================================
// 完成打卡
// ============================================================
function finishDay(){
  if(studyDone) return;
  const done=getDone();
  if(!done.includes(currentDay)){done.push(currentDay);saveDone(done)}
  studyDone=true;
  const btn=document.getElementById('btn-done');
  btn.textContent='✅ 今日已完成 · 明天继续加油！';
  btn.classList.add('done');btn.disabled=true;
  toast('🎉 打卡成功！明天继续！');
  setTimeout(()=>renderStudy(),500);
}

// ============================================================
// 复习操作
// ============================================================
function handleReview(key,grade,el){
  reviewAction(key,grade);
  const item=el.closest('.ritem');
  item.style.transition='all .3s';
  item.style.opacity='0';item.style.transform='translateX(20px)';
  setTimeout(()=>{renderStudy()},300);
}

// ============================================================
// 全部短语页面
// ============================================================
function renderAll(){
  let h='<input class="search-box" id="search-box" type="text" placeholder="🔍 搜索短语（中英文均可）..." oninput="filterAll()">';
  const cats=Object.keys(PHRASES);
  cats.forEach((cat,i)=>{
    h+='<div class="sec-col'+(i===0?' open':'')+'" onclick="this.classList.toggle(\'open\');this.nextElementSibling.classList.toggle(\'show\')"><span>'+cat+' ('+PHRASES[cat].length+'句)</span><span class="arr">▼</span></div>';
    h+='<div class="col-body'+(i===0?' show':'')+'" id="col-'+cat+'">';
    PHRASES[cat].forEach(p=>{
      h+='<div class="pitem" onclick="speak(\''+p[0].replace(/'/g,"\\'")+'\')"><div class="pi"><div class="en">'+p[0]+'</div><div class="zh">'+p[1]+'</div></div><button class="btn-spk" onclick="event.stopPropagation();speak(\''+p[0].replace(/'/g,"\\'")+'\')">🔊</button></div>';
    });
    h+='</div>';
  });
  document.getElementById('page-all').innerHTML=h;
}

function filterAll(){
  const q=document.getElementById('search-box').value.toLowerCase();
  document.querySelectorAll('#page-all .pitem').forEach(el=>{
    const en=el.querySelector('.en').textContent.toLowerCase();
    const zh=el.querySelector('.zh').textContent.toLowerCase();
    el.style.display=(!q||en.includes(q)||zh.includes(q))?'flex':'none';
  });
  // auto expand matching sections
  document.querySelectorAll('#page-all .col-body').forEach(b=>{
    const has=Array.from(b.querySelectorAll('.pitem')).some(el=>el.style.display!=='none');
    b.classList.toggle('show',has);
    const sec=b.previousElementSibling;
    if(sec) sec.classList.toggle('open',has);
  });
}

// ============================================================
// 我的短句页面
// ============================================================
function renderMy(){
  const items=getMy();
  let h='<div class="add-box"><h3>✏️ 添加自定义短句</h3>';
  h+='<input id="my-en" placeholder="English phrase" maxlength="200"><input id="my-zh" placeholder="中文翻译" maxlength="200">';
  h+='<button onclick="addMy()">添加</button></div>';
  if(items.length===0){h+='<div style="text-align:center;color:#bbb;padding:30px;font-size:14px">还没有自定义短句，添加第一条吧 ✨</div>'}
  else{h+='<div class="pcard list">';items.forEach((p,i)=>{h+='<div class="pitem" onclick="speak(\''+p[0].replace(/'/g,"\\'")+'\')"><div class="pi"><div class="en">'+p[0]+'</div><div class="zh">'+p[1]+'</div></div><button class="btn-spk" onclick="event.stopPropagation();speak(\''+p[0].replace(/'/g,"\\'")+'\')">🔊</button><button class="btn-spk" style="background:#fee" onclick="event.stopPropagation();delMy('+i+')">🗑</button></div>'});h+='</div>'}
  document.getElementById('page-my').innerHTML=h;
}
function addMy(){
  const en=document.getElementById('my-en').value.trim();
  const zh=document.getElementById('my-zh').value.trim();
  if(!en||!zh){toast('请填写完整');return}
  const items=getMy();items.push([en,zh]);saveMy(items);
  toast('已添加');renderMy();
}
function delMy(i){const items=getMy();items.splice(i,1);saveMy(items);renderMy();toast('已删除')}

// ============================================================
// Tab 切换
// ============================================================
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
    const tab=t.dataset.tab;
    document.getElementById('page-'+tab).classList.add('active');
    if(tab==='study') renderStudy();
    if(tab==='all') renderAll();
    if(tab==='my') renderMy();
  });
});

// ============================================================
// 启动
// ============================================================
renderStudy();
renderAll();
renderMy();

</script>
