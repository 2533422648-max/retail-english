<script>
// ============ 6个月课程体系 (24周, 每周7天, 共168天) ============

const CURR = [
// 第1个月：零售英语基础 (Weeks 1-4)
{w:'接待与问候',m:1, d:[
  {n:'基本问候',p:[['Hello! How are you today?','你好！今天怎么样？'],['Good morning! Welcome to our store.','早上好！欢迎光临。'],['Nice to meet you. I am your shopping assistant.','很高兴见到您，我是您的导购。']],
   c:[['Hello, welcome!','您好，欢迎光临！'],['Hi, thank you. This store is beautiful.','你好，谢谢。你们店真漂亮。'],['Thank you! Let me know if you need any help.','谢谢！有需要随时叫我。']]},
  {n:'自我介绍与询问需求',p:[['How can I help you today?','今天有什么可以帮您的？'],['Are you looking for anything specific?','您在找什么特定的款式吗？'],['Is this your first time shopping with us?','您是第一次来我们家吗？']],
   c:[['What brings you in today?','今天想找什么？'],['I am just looking around for now.','我先随便看看。'],['Sure! Take your time. I will be right here.','好的您慢慢看，我就在这边。']]},
  {n:'欢迎回头客',p:[['Welcome back! So nice to see you again.','欢迎回来！很高兴又见到您。'],['How did you like the jacket you bought last time?','上次那件夹克穿得怎么样？'],['We just got some new arrivals you might like.','我们刚到了一批新款，您可能会喜欢。']],
   c:[['Hey, you are back!','嘿，您又来啦！'],['Yes! I loved the dress I bought here.','对！上次买的裙子很喜欢。'],['That is great! Let me show you our new styles.','太好了！我带您看看新款。'],['Perfect, I would love that.','好呀，正想看呢。']]},
  {n:'介绍店铺布局',p:[['The women\'s section is on this floor.','女装区在这一层。'],['Fitting rooms are in the back, to your right.','试衣间在后面右手边。'],['We also have shoes and accessories upstairs.','楼上还有鞋子和配饰。']],
   c:[['Where is the fitting room?','试衣间在哪？'],['Right over there, in the corner.','就在那边角落里。'],['Can I take more than three items in?','可以拿三件以上进去吗？'],['Of course! Take as many as you like.','当然！随便拿。']]},
  {n:'表达感谢',p:[['Thank you so much for your patience.','非常感谢您的耐心。'],['I really appreciate you coming in today.','真的很感谢您今天光临。'],['It was a pleasure helping you.','很高兴为您服务。']],
   c:[['Thank you for your help today.','谢谢你今天的帮助。'],['My pleasure! Have a wonderful day!','不客气！祝您愉快！'],['You too! See you next time.','你也是！下次见。']]},
  {n:'道别与邀请再来',p:[['Hope to see you again soon!','希望很快再见到您！'],['We have new arrivals every Friday.','我们每周五都有新款到。'],['Feel free to come back anytime.','随时欢迎再来。']],
   c:[['I will definitely come back next week.','我下周肯定再来。'],['Great! I will save some new styles for you.','太好了！我给您留些新款。'],['You are so kind. Goodbye!','你真好。再见！']]},
  {n:'第一周复习',p:[['Let me know if you have any questions.','有任何问题随时问我。'],['Would you like me to gift wrap this?','需要帮您包装成礼品吗？'],['Thank you for shopping with us!','感谢您在我们店购物！']],
   c:[['I think that is everything I need.','我想要的就这些了。'],['Wonderful! Let me ring you up.','好的！我帮您结账。'],['Can I pay by card?','可以刷卡吗？'],['Yes, we accept all major cards.','可以的，主流银行卡都支持。']]}
]},
{w:'商品介绍与材质',m:1, d:[
  {n:'服装品类',p:[['We have jackets, coats, sweaters, and hoodies.','我们有夹克、大衣、毛衣和卫衣。'],['This rack is all the new arrivals.','这个货架全是新款。'],['Dresses and skirts are over on that side.','连衣裙和半身裙在那边。']],
   c:[['Where can I find casual shirts?','休闲衬衫在哪？'],['Right here. What color do you prefer?','这边。您喜欢什么颜色？'],['Something light, maybe white or blue.','浅色的，白色或蓝色吧。']]},
  {n:'面料材质',p:[['This is 100% pure cotton, very breathable.','这是100%纯棉，非常透气。'],['It is a cotton-polyester blend, wrinkle-free.','这是棉涤混纺的，不易起皱。'],['The lining is silk, so it feels very smooth.','内衬是真丝的，手感很顺滑。']],
   c:[['What material is this made of?','这是什么面料？'],['It is linen — perfect for summer.','亚麻的，夏天穿特别舒服。'],['Will it shrink after washing?','洗了会缩水吗？'],['No, it is pre-washed. Machine wash is fine.','不会，做过预缩处理，机洗没问题。']]},
  {n:'颜色与图案',p:[['We have this in black, white, and navy blue.','这款有黑色、白色和深蓝色。'],['This floral print is very popular this season.','这个碎花图案这季非常流行。'],['Solid colors are more versatile for daily wear.','纯色更适合日常搭配。']],
   c:[['Do you have this in a darker color?','这款有深一点的颜色吗？'],['Yes, we have it in dark gray too.','有的，还有深灰色的。'],['Can I see the dark gray one?','深灰的能给我看看吗？'],['Of course, let me grab it for you.','当然，我去帮您拿。']]},
  {n:'款式风格',p:[['This is a casual style, great for everyday wear.','这是休闲款，很适合日常穿。'],['That one is more formal, good for the office.','那件偏正式，适合上班穿。'],['This slim-fit cut is very trendy right now.','这个修身版型现在很流行。']],
   c:[['I need something for a business meeting.','我需要开会穿的衣服。'],['This blazer would be perfect for that.','这件西装外套就很合适。'],['It looks very professional.','看起来很干练。'],['It does! And it pairs well with jeans too.','是的！配牛仔裤也很好看。']]},
  {n:'面料护理',p:[['This needs to be dry cleaned only.','这款只能干洗。'],['You can machine wash this in cold water.','这个可以冷水机洗。'],['Hang dry, do not put it in the dryer.','悬挂晾干，不要放烘干机。']],
   c:[['How do I wash this sweater?','这件毛衣怎么洗？'],['Hand wash in cold water, lay flat to dry.','冷水手洗，平铺晾干。'],['That sounds easy enough.','听起来不算麻烦。'],['It is! And it will last for years if cared properly.','是的！保养得当可以穿好几年。']]},
  {n:'推荐搭配',p:[['This top goes really well with those jeans.','这件上衣配那条牛仔裤很好看。'],['You can dress it up with heels or down with sneakers.','配高跟鞋正式，配运动鞋休闲。'],['A complete outfit from head to toe!','从头到脚一套完整搭配！']],
   c:[['What would you pair this with?','这件你觉得怎么搭？'],['I would say a white tee and these ankle boots.','我会搭白T恤和这双短靴。'],['Oh, that sounds really nice!','听起来真不错！'],['Try it on and see how you feel!','试试看感觉怎么样！']]},
  {n:'周复习：描述商品',p:[['This fabric is soft, lightweight, and durable.','这个面料柔软、轻薄还耐穿。'],['It comes in multiple colors and sizes.','有多种颜色和尺码可选。'],['Definitely one of our best quality items.','绝对是我们质量最好的款之一。']],
   c:[['Why is this one more expensive?','为什么这件更贵？'],['The material is imported and the stitching is hand-done.','面料是进口的，缝线是手工的。'],['I can tell the difference now that you mention it.','你一说我确实看出差别了。']]}
]},
{w:'尺码、试穿与反馈',m:1, d:[
  {n:'询问尺码',p:[['What size do you normally wear?','您平时穿什么码？'],['We carry sizes from XS to XXL.','我们有XS到XXL码。'],['Let me check if we have your size.','我帮您查一下有没有您的码。']],
   c:[['Do you have this in medium?','这款有中号吗？'],['Let me check. Yes, here you go.','我看看。有的，给您。'],['Thanks! Where can I try it on?','谢谢！试衣间在哪？']]},
  {n:'试穿引导',p:[['Would you like to try it on?','要试穿一下吗？'],['The fitting room is right this way.','试衣间这边请。'],['Take your time. I will wait right outside.','慢慢试，我在外面等您。']],
   c:[['Can I try both of these?','这两件都能试吗？'],['Absolutely! I will hang them in the room for you.','当然！我帮您挂到试衣间里。'],['Thank you so much.','太感谢了。']]},
  {n:'尺码不合适',p:[['This one runs a little small, try a size up.','这款偏小，试试大一码。'],['It is a bit loose. Would you like a smaller size?','有点松，要试试小一码吗？'],['The sleeves are too long for me.','袖子对我来说太长了。']],
   c:[['This feels a bit tight in the shoulders.','肩这里有点紧。'],['Let me bring you a size large.','我给您换个大号。'],['Yes please, that might work better.','好的，大号可能更合适。']]},
  {n:'赞美顾客',p:[['That looks amazing on you!','您穿这个太好看了！'],['This color really suits your skin tone.','这个颜色很衬您的肤色。'],['It fits you like it was made for you.','太合身了，像量身定做的一样。']],
   c:[['What do you think? Does it look okay?','你觉得怎么样？还行吗？'],['Are you kidding? It is perfect on you!','开什么玩笑？太完美了！'],['Really? I am not sure about the length.','真的吗？我不太确定长度。'],['The length is just right — it hits exactly at the right spot.','长度刚好，恰到好处。']]},
  {n:'试穿反馈',p:[['How does it feel? Comfortable?','穿起来感觉怎么样？舒服吗？'],['Do you like the fit?','您觉得版型怎么样？'],['Walk around a bit, see how it moves.','走几步看看活动起来怎么样。']],
   c:[['I love the fabric, but the color is not quite me.','面料很喜欢，但颜色不太适合我。'],['No problem! Let me show you the same style in blue.','没问题！这款还有蓝色的。'],['Blue would be much better!','蓝色就好多了！']]},
  {n:'比较试穿',p:[['Which one do you prefer?','您更喜欢哪一件？'],['They both look great, but for different occasions.','两件都好看，适合不同场合。'],['Take a photo in the mirror if you want!','想的话可以对着镜子拍张照！']],
   c:[['I cannot decide between these two.','这两件我选不出来。'],['The black one is more classic, the red is more bold.','黑色更经典，红色更大胆。'],['You are right. I will go with the classic black.','你说得对，我选经典的黑色。']]},
  {n:'第三周复习',p:[['Always try things on — sizes vary by brand.','一定要试穿，不同品牌尺码不一样。'],['If it does not feel right, do not buy it.','穿起来不舒服就别买。'],['Comfort and confidence are equally important.','舒适和自信同样重要。']],
   c:[['I think I will take all three items!','这三件我都要了！'],['Excellent choices! Let me help you to the counter.','选得太好了！我帮您拿到收银台。'],['You have been so helpful today.','你今天帮了太多忙了。'],['That is what I am here for!','这是我应该做的！']]}
]},
{w:'价格、付款与售后',m:1, d:[
  {n:'价格询问',p:[['How much is this one?','这件多少钱？'],['It is two hundred and ninety-nine yuan.','这件299元。'],['The price tag is on the inside label.','价格标签在内标上。']],
   c:[['Is there a discount on this?','这件有折扣吗？'],['It is already 30% off, the original was 429.','已经打7折了，原价429。'],['Oh, that is a really good deal!','那确实很划算！']]},
  {n:'优惠活动',p:[['We have a buy-one-get-one-half-off promotion.','我们有第二件半价活动。'],['If you spend over 500, you get 50 off.','满500减50。'],['Members get an extra 10% off.','会员额外享受9折。']],
   c:[['Do I need a membership card for the discount?','会员卡才能打折吗？'],['You can sign up right now, it is free!','可以现在就办，免费的！'],['Okay, sign me up!','好，帮我办一张！']]},
  {n:'付款方式',p:[['We accept cash, WeChat, Alipay, and bank cards.','我们可以收现金、微信、支付宝和银行卡。'],['Would you like to split the payment?','需要分开付吗？'],['Please scan the QR code here.','请扫这里的二维码。']],

  {n:'打包与发票',p:[['Would you like a gift receipt?','需要礼品小票吗？'],['Shall I wrap it as a gift?','需要帮您包装成礼品吗？'],['Would you like a paper bag or just the item?','要纸袋还是就拿商品？']],
   c:[['Can you gift wrap this one? It is a present.','这个能帮我包装吗？是送人的。'],['Of course! Let me make it look beautiful.','当然！我帮您包得漂漂亮亮的。'],['Thank you, that would be lovely.','谢谢，太好了。']]},

   c:[['There is a small stain on this shirt.','这件衬衫上有个小污渍。'],['Oh no, let me get you a brand new one.','哎呀，我给您拿件全新的。'],['Thank you for handling it so quickly.','谢谢处理得这么快。']]},
  {n:'第四周复习',p:[['Your total comes to 568 yuan.','您一共消费568元。'],['Here is your change and receipt.','这是找您的钱和小票。'],['Thank you for your purchase! Come back soon!','感谢惠顾！下次再来！']],

// ============ 工具函数 ============
function speak(text){
  if(!('speechSynthesis' in window)){showToast('浏览器不支持语音朗读');return}
  speechSynthesis.cancel()
  const u = new SpeechSynthesisUtterance(text)
  u.lang='en-US'; u.rate=0.85; u.pitch=1
  speechSynthesis.speak(u)
}

function showToast(msg){
  const t=document.getElementById('toast')
  t.textContent=msg; t.classList.add('show')
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800)
}

// ============ Tab切换 ============
document.getElementById('tabs').addEventListener('click',function(e){
  if(!e.target.classList.contains('tab'))return
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'))
  e.target.classList.add('active')
  const p=e.target.getAttribute('data-page')
  document.querySelectorAll('.page').forEach(g=>g.classList.remove('active'))
  document.getElementById(p).classList.add('active')
  if(p==='study')renderStudy()
  else if(p==='custom')renderCustom()
})

// ============ 今日学习 ============
function getProgress(){
  return JSON.parse(localStorage.getItem('studyProgress')||'{"done":{},"streak":0,"lastDate":"","totalDone":0}')
}
function saveProgress(p){localStorage.setItem('studyProgress',JSON.stringify(p))}

function getTodayIndex(){
  const start=new Date('2026-07-13')
  const today=new Date()
  today.setHours(0,0,0,0)
  const days=Math.floor((today-start)/(1000*60*60*24))
  return Math.max(0,Math.min(days,27))
}

function renderStudy(){
  const d=document.getElementById('study')
  const idx=getTodayIndex()
  const prog=getProgress()
  const totalDays=28

  // 计算周和天
  let weekIdx=0, dayIdx=idx, remaining=idx
  while(remaining>=7){remaining-=7; weekIdx++}
  dayIdx=remaining
  if(weekIdx>=CURR.length)weekIdx=CURR.length-1
  const week=CURR[weekIdx]
  if(dayIdx>=week.d.length)dayIdx=week.d.length-1
  const day=week.d[dayIdx]

  // 连续打卡
  const todayStr=new Date().toISOString().slice(0,10)
  const yesterdayStr=new Date(Date.now()-86400000).toISOString().slice(0,10)
  if(prog.lastDate===yesterdayStr && !prog.done[idx]){
    prog.streak++
  }else if(prog.lastDate!==yesterdayStr && prog.lastDate!==todayStr && !prog.done[idx]){
    prog.streak=0
  }
  prog.lastDate=todayStr
  saveProgress(prog)

  const isDone=prog.done[idx]
  const doneCount=Object.keys(prog.done).length
  const progressPct=Math.round(doneCount/totalDays*100)

  // 确定标签
  let tagHTML=''
  if(week.m<=2)tagHTML='<span class="tag tag-retail">零售场景</span>'
  else if(week.m<=4)tagHTML='<span class="tag tag-daily">日常对话</span>'
  else tagHTML='<span class="tag tag-adv">进阶表达</span>'

  d.innerHTML=`
    <div class="study-header">
      <div class="study-day">第 ${idx+1} 天</div>
      <div class="study-label">${week.m}月 · ${week.w} · ${day.n}</div>
      ${tagHTML}
      <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      <div class="progress-text">总进度 ${doneCount}/${totalDays} (${progressPct}%)</div>
    </div>

    <div class="streak-box">
      <div class="streak-item"><div class="streak-num">🔥 ${prog.streak}</div><div class="streak-label">连续打卡</div></div>
      <div class="streak-item"><div class="streak-num">⭐ ${doneCount}</div><div class="streak-label">累计完成</div></div>
    </div>

    <div class="week-header">
      <div class="wk-title">第${weekIdx+1}周 · ${week.w}</div>
      <div class="wk-sub">第${week.m}个月 | 每日3句 + 1个场景对话</div>
    </div>

    <div class="section-title">📝 今日新短句</div>
    ${day.p.map(item=>`
      <div class="card" onclick="speak('${item[0].replace(/'/g,"\\'")}')">
        <div class="card-left"><div class="card-en">${item[0]}</div><div class="card-zh">${item[1]}</div></div>
        <div class="speak-icon">🔊</div>
      </div>
    `).join('')}

    ${day.c?`
    <div class="conv-box">
      <div class="conv-title">💬 场景对话</div>
      ${day.c.map(line=>`
        <div class="conv-line" onclick="speak('${line[0].replace(/'/g,"\\'")}')">
          <div class="conv-en">${line[0]}</div>
          <div class="conv-zh">${line[1]}</div>
        </div>
      `).join('')}
    </div>
    `:''}

    <button class="check-btn${isDone?' done':''}" id="checkBtn" ${isDone?'disabled':''}>
      ${isDone?'✅ 今日已完成':'✅ 打卡完成今日学习'}
    </button>
  `

  if(!isDone){
    document.getElementById('checkBtn').addEventListener('click',function(){
      const p=getProgress()
      p.done[idx]=true
      p.totalDone=(p.totalDone||0)+1
      if(!p.streakDate||p.streakDate!==todayStr){
        if(p.streakDate===yesterdayStr)p.streak++
        else p.streak=1
        p.streakDate=todayStr
      }
      saveProgress(p)
      renderStudy()
      showToast('🎉 打卡成功！继续加油！')
    })
  }
}

// ============ 短语合集（支持搜索 + 分类折叠）============
function renderPhrases(){
  const d=document.getElementById('phrases')
  let html='<div style="margin-bottom:12px"><input type="text" id="searchInput" placeholder="🔍 搜索短句..." style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px;outline:none"></div>'
  html+='<div id="searchResults" style="display:none"></div><div id="phraseSections">'

  const entries=Object.entries(PHRASES)
  entries.forEach(([title,items],si)=>{
    html+=`<div class="month-divider">📌 ${title} (${items.length}句)</div>`
    items.forEach(item=>{
      html+=`<div class="card phrase-card" data-en="${item[0].replace(/"/g,'&quot;')}" data-zh="${item[1].replace(/"/g,'&quot;')}" data-section="${title}">
        <div class="card-left"><div class="card-en">${item[0]}</div><div class="card-zh">${item[1]}</div></div>
        <div class="speak-icon">🔊</div>
      </div>`
    })
  })
  html+='</div>'
  d.innerHTML=html

  // 点击播放
  d.querySelectorAll('.phrase-card').forEach(card=>{
    card.addEventListener('click',function(){speak(this.getAttribute('data-en'))})
  })

  // 搜索功能
  const searchInput=d.querySelector('#searchInput')
  searchInput.addEventListener('input',function(){
    const q=this.value.trim().toLowerCase()
    const results=d.querySelector('#searchResults')
    const sections=d.querySelector('#phraseSections')
    if(!q){results.style.display='none'; sections.style.display='block'; d.querySelectorAll('.phrase-card').forEach(c=>c.style.display=''); return}
    results.style.display='block'; sections.style.display='none'
    let found=[]
    d.querySelectorAll('.phrase-card').forEach(card=>{
      const en=card.getAttribute('data-en').toLowerCase()
      const zh=card.getAttribute('data-zh').toLowerCase()
      if(en.includes(q)||zh.includes(q))found.push(card)
    })
    if(found.length===0){results.innerHTML='<div class="empty-hint">没有找到匹配的短句</div>'}
    else{results.innerHTML=''; found.forEach(c=>results.appendChild(c.cloneNode(true)));
      results.querySelectorAll('.phrase-card').forEach(c=>c.addEventListener('click',function(){speak(this.getAttribute('data-en'))}))}
  })
}

// ============ 我的短句 ============
function renderCustom(){
  const d=document.getElementById('custom')
  const saved=JSON.parse(localStorage.getItem('customPhrases')||'[]')
  let html=''
  if(saved.length===0)html+='<div class="empty-hint">还没有自定义短句<br>在下方添加你的专属短句吧</div>'
  else saved.forEach((item,i)=>{
    html+=`<div class="card" onclick="if(!event.target.closest('.delete-btn'))speak('${item.en.replace(/'/g,"\\'")}')">
      <div class="card-left"><div class="card-en">${item.en}</div><div class="card-zh">${item.zh}</div></div>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="delete-btn" data-idx="${i}">×</button>
        <div class="speak-icon" style="margin-left:0">🔊</div>
      </div>
    </div>`
  })
  html+=`<div class="add-section"><h3>➕ 添加新短句</h3>
    <input type="text" id="enInput" placeholder="输入英文短句">
    <input type="text" id="zhInput" placeholder="输入中文翻译">
    <button class="btn-primary" id="addBtn">添加到我的短句</button>
  </div>`
  d.innerHTML=html

  // 删除
  d.querySelectorAll('.delete-btn').forEach(btn=>{
    btn.addEventListener('click',function(e){
      e.stopPropagation()
      const i=parseInt(this.getAttribute('data-idx'))
      const s=JSON.parse(localStorage.getItem('customPhrases')||'[]')
      s.splice(i,1)
      localStorage.setItem('customPhrases',JSON.stringify(s))
      renderCustom(); showToast('已删除')
    })
  })

  // 添加
  const addBtn=d.querySelector('#addBtn')
  if(addBtn)addBtn.addEventListener('click',function(){
    const en=document.getElementById('enInput').value.trim()
    const zh=document.getElementById('zhInput').value.trim()
    if(!en||!zh){showToast('请填写英文和中文');return}
    const s=JSON.parse(localStorage.getItem('customPhrases')||'[]')
    s.push({en,zh})
    localStorage.setItem('customPhrases',JSON.stringify(s))
    renderCustom(); showToast('已添加！')
  })
}

// ============ 初始化 ============
renderStudy()    // 默认显示今日学习
renderPhrases()
renderCustom()
</script>
